    <div class="footer__links">
      <div class="footer__links-group">
        <h4 class="footer__links-title">Telusuri</h4>
        <a
          *ngFor="let menu of navMenus"
          [routerLink]="menu.path"
          class="footer__link"
        >
          {{ menu.label }}
        </a>
      </div>

      <div class="footer__links-group">
        <h4 class="footer__links-title">Bantuan</h4>
        <a
          *ngFor="let menu of helpMenus"
          [routerLink]="menu.path"
          class="footer__link"
        >
          {{ menu.label }}
        </a>
      </div>
    </div>
